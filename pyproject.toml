[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimo-usage"
version = "2.0.0"
description = "Read-only Sanic service that exposes platform.xiaomimimo.com (MiMo) usage data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wx2020" }]
keywords = ["mimo", "xiaomi", "token-plan", "usage", "dashboard", "sanic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "sanic>=23.12",
    "httpx>=0.27",
    "orjson>=3.9",
    "uvloop>=0.19; sys_platform != 'win32'",
    "pyyaml>=6.0",
    "bcrypt>=4.0",
]

[project.urls]
Homepage = "https://github.com/wx2020/mimo-usage"
Repository = "https://github.com/wx2020/mimo-usage"
Issues = "https://github.com/wx2020/mimo-usage/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "sanic-testing>=23.12",
]

[project.scripts]
mimo-usage = "mimo_usage.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mimo_usage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = [
    "B008",   # Sanic 的 @app.get(...) 就是函数调用形式的依赖注入
    "RET504", # 先赋值再 return 有时更易读
]

[tool.ruff.lint.per-file-ignores]
# 测试里的 httpx handler 必须保持 (request) 签名
"tests/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["mimo_usage"]
