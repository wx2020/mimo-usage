<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMo 用量看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff824b'/%3E%3Ctext x='16' y='23' font-size='17' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EMi%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{STATIC}}/style.css?v={{VERSION}}">
</head>
<body>
<div class="wrap">
  <header>
    <h1>MiMo 用量看板</h1>
    <span class="badge" id="plan">--</span>
    <span class="spacer"></span>
    <span class="muted" id="updated">加载中…</span>
    <button id="refresh">刷新</button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div id="hero" class="grid hero"></div>
  <div id="stats" class="grid stats"></div>
  <div id="stats-2" class="grid stats"></div>

  <section class="panel">
    <h2>Token 用量趋势</h2>
    <div class="chart-row">
      <div id="trend-yaxis" class="yaxis"></div>
      <div id="trend-chart" class="chart bar-chart"></div>
    </div>
    <div id="trend-axis" class="axis"></div>
    <div id="trend-legend" class="legend"></div>
  </section>

  <section class="panel">
    <h2>模型分布</h2>
    <div id="model-bars" class="model-bars"></div>
  </section>

  <section class="panel">
    <h2>套餐与账户</h2>
    <div id="account" class="grid cards"><div class="card empty">加载中…</div></div>
  </section>

  <div id="errors" class="errors"></div>
</div>

<script src="{{STATIC}}/app.js?v={{VERSION}}"></script>
</body>
</html>
